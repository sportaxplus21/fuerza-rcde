<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.45 system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1757A6">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%227%22 fill=%22%231757A6%22/%3E%3Cpath d=%22M10 7h5l-3 18H7z%22 fill=%22white%22/%3E%3C/svg%3E">
<title>Fuerza RCDE</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: app shell — sticky header, one working column (max 1180px), bottom tab bar on phones, top tabs on desktop; sheets slide in from the right */
:root{
  --bg:#F2F5FA; --surface:#FFFFFF; --surface-2:#E7ECF4; --line:#D3DBE7; --fg:#0D1A2C; --muted:#5A687E;
  --accent:#1757A6; --accent-rgb:23,87,166; --accent-fg:#FFFFFF; --accent-soft:#DCE7F7;
  --ok:#1C8A57; --warn:#B9770C; --bad:#C0383A;
  --f-bas:#1757A6; --f-com:#0C8789; --f-exc:#8A3DB6; --f-cm:#C9720A; --f-core:#2C8A3C; --f-lib:#C0447A;
  --t-push:#1757A6; --t-pull:#0C8789; --t-prev:#2C8A3C; --t-mov:#C9720A; --t-fis:#7451D1; --fis:#7451D1; --rea:#D9622B; --t-ses:#5A687E;
  --l-POR:#B9770C; --l-DEF:#1757A6; --l-MED:#2C8A3C; --l-DEL:#C0383A;
  --shadow:0 1px 2px rgb(13 26 44/.08),0 4px 14px rgb(13 26 44/.06);
  --font-d:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  --font-b:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A101B; --surface:#121A28; --surface-2:#1A2435; --line:#27334A; --fg:#E6EDF7; --muted:#93A2BA;
  --accent:#5C9DEB; --accent-rgb:92,157,235; --accent-fg:#071121; --accent-soft:#18304F;
  --ok:#3CC283; --warn:#E3A43A; --bad:#EE6B6B;
  --f-bas:#5C9DEB; --f-com:#36C1C2; --f-exc:#B67DE2; --f-cm:#F0A144; --f-core:#5CC46C; --f-lib:#E87BA7;
  --t-push:#5C9DEB; --t-pull:#36C1C2; --t-prev:#5CC46C; --t-mov:#F0A144; --t-fis:#A48BF5; --fis:#A48BF5; --rea:#F0875A; --t-ses:#93A2BA;
  --l-POR:#E3A43A; --l-DEF:#5C9DEB; --l-MED:#5CC46C; --l-DEL:#EE6B6B;
  --shadow:0 1px 2px rgb(0 0 0/.3),0 4px 14px rgb(0 0 0/.25);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A101B; --surface:#121A28; --surface-2:#1A2435; --line:#27334A; --fg:#E6EDF7; --muted:#93A2BA;
  --accent:#5C9DEB; --accent-rgb:92,157,235; --accent-fg:#071121; --accent-soft:#18304F;
  --ok:#3CC283; --warn:#E3A43A; --bad:#EE6B6B;
  --f-bas:#5C9DEB; --f-com:#36C1C2; --f-exc:#B67DE2; --f-cm:#F0A144; --f-core:#5CC46C; --f-lib:#E87BA7;
  --t-push:#5C9DEB; --t-pull:#36C1C2; --t-prev:#5CC46C; --t-mov:#F0A144; --t-fis:#A48BF5; --fis:#A48BF5; --rea:#F0875A; --t-ses:#93A2BA;
  --l-POR:#E3A43A; --l-DEF:#5C9DEB; --l-MED:#5CC46C; --l-DEL:#EE6B6B;
  --shadow:0 1px 2px rgb(0 0 0/.3),0 4px 14px rgb(0 0 0/.25);
  color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--font-b);-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,.tn{font-variant-numeric:tabular-nums}
.spacer{flex:1}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--font-d);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance}
h2{font-size:26px;line-height:1.1}
h3{font-size:18px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
small,.muted{color:var(--muted)}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* header */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.hdr-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:10px;padding-block:10px}
.brand{font-family:var(--font-d);font-weight:700;font-size:23px;letter-spacing:.05em;display:flex;align-items:center;gap:8px;white-space:nowrap}
.brand i{display:inline-block;width:9px;height:22px;background:var(--accent);border-radius:2px;transform:skewX(-14deg)}
.brand span{color:var(--accent)}
.tabs-top{display:none;gap:2px;margin-left:14px}
.tab{padding:8px 12px;border-radius:9px;font-weight:600;color:var(--muted);display:flex;gap:6px;align-items:center}
.tab:hover{background:var(--surface-2)}
.tab[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{padding:6px 11px;border-radius:8px;font-weight:600;font-size:14px;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgb(0 0 0/.14)}
.icon-btn{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:var(--muted);flex:none}
.icon-btn:hover{background:var(--surface-2);color:var(--fg)}
.icon-btn.sm{width:32px;height:32px}
.icon-btn.sm svg.i{width:17px;height:17px}
main{max-width:1180px;margin:0 auto;padding-block:18px 110px}
.nav-bot{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(7,1fr);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.nav-bot button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 7px;font-size:10px;letter-spacing:-.01em;min-width:0;font-weight:600;color:var(--muted)}
.nav-bot button[aria-current="page"]{color:var(--accent)}
@media(min-width:1120px){.tabs-top{display:flex}.nav-bot{display:none}main{padding-bottom:48px}}
.tab{padding:8px 10px}
.team-seg{flex-wrap:nowrap}
@media(max-width:1320px){.tabs-top svg.i{display:none}}
@media(max-width:520px){.brand{font-size:20px}.brand b{display:none}.team-seg button{padding:6px 9px}}

/* generic */
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.pad{padding:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:40px;padding:0 16px;border-radius:10px;font-weight:600;background:var(--surface-2);white-space:nowrap}
.btn:hover{filter:brightness(.97)}
.btn.pri{background:var(--accent);color:var(--accent-fg)}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.danger{color:var(--bad)}
.btn.danger.arm{background:var(--bad);color:#fff}
.btn.sm{height:32px;padding:0 11px;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{--cc:var(--accent);height:34px;padding:0 12px;border-radius:17px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;white-space:nowrap}
.chip.sm{height:30px;padding:0 10px;font-size:13px;font-weight:500}
.chip.on{background:var(--cc);border-color:var(--cc);color:#fff}
:root[data-theme="dark"] .chip.on{color:#071121}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip.on{color:#071121}}
.inp{height:40px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:0 11px;min-width:0}
.inp:focus{border-color:var(--accent);outline:none}
select.inp{padding-right:6px}
.lbl{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.banner{background:var(--accent-soft);color:var(--fg);border-radius:12px;padding:10px 14px;font-size:14px;margin-bottom:14px}

/* MD chips + family */
.md{white-space:nowrap;display:inline-flex;align-items:center;height:22px;padding:0 7px;border-radius:6px;font-family:var(--font-d);font-weight:700;font-size:14px;letter-spacing:.03em;background:var(--surface-2);color:var(--muted)}
.md.m{background:var(--accent-soft);color:var(--accent)}
.md.z{background:var(--bad);color:#fff}
.ftag{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.05em}
.ftag::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--fc)}
.fdots{display:flex;gap:4px;flex-wrap:wrap}
.fdot{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:700;color:var(--muted)}
.fdot::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--fc)}
.f-bas{--fc:var(--f-bas)}.f-com{--fc:var(--f-com)}.f-exc{--fc:var(--f-exc)}.f-cm{--fc:var(--f-cm)}.f-core{--fc:var(--f-core)}.f-lib{--fc:var(--f-lib)}

/* lock */
#lock{position:fixed;inset:0;z-index:60;background:var(--bg);display:grid;place-items:center;padding:24px}
.lock-box{width:min(340px,100%);display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center}
.lock-box .brand{font-size:34px}
.pin-dots{display:flex;gap:14px;height:20px}
.pin-dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--muted)}
.pin-dots i.on{background:var(--accent);border-color:var(--accent)}
.pin-dots.err i{border-color:var(--bad)}
.keypad{display:grid;grid-template-columns:repeat(3,76px);gap:12px}
.keypad button{height:64px;border-radius:16px;background:var(--surface);border:1px solid var(--line);font-family:var(--font-d);font-size:28px;font-weight:600}
.keypad button:active{background:var(--accent-soft)}

/* week */
.wk-hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.wk-hd h2{min-width:0}
.next-m{display:flex;align-items:center;gap:12px;padding:12px 14px;margin-bottom:14px;flex-wrap:wrap}
.next-m .vs{font-family:var(--font-d);font-size:22px;font-weight:700}
.week{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(150px,1fr);gap:8px;overflow-x:auto;scroll-snap-type:x proximity;padding-bottom:8px;-webkit-overflow-scrolling:touch}
.day{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0;min-height:300px;scroll-snap-align:start}
.day.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.day-hd{display:flex;align-items:center;gap:4px 6px;flex-wrap:wrap}
.day-hd b{font-family:var(--font-d);font-size:19px;font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.day-hd small{font-weight:600}
.match-pill{background:var(--bad);color:#fff;border-radius:9px;padding:6px 9px;font-weight:700;font-size:13.5px;display:flex;gap:6px;align-items:center;min-width:0}
.match-pill span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scard{display:flex;flex-direction:column;gap:5px;text-align:left;padding:9px 10px;border-radius:10px;background:var(--surface-2);width:100%}
.scard:hover{filter:brightness(.97)}
.scard .t{font-weight:700;font-size:14px;line-height:1.2;overflow-wrap:anywhere}
.scard .meta{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);font-weight:600;flex-wrap:wrap}
.st{width:8px;height:8px;border-radius:50%;background:var(--warn);flex:none}
.st.ok{background:var(--ok)}.st.fut{background:var(--line)}
.bl{display:flex;align-items:baseline;gap:5px;font-size:12px;line-height:1.25;color:var(--fg);text-align:left}
.bl::before{content:"";width:7px;height:7px;border-radius:2px;background:var(--fc);flex:none;transform:translateY(-1px)}
.bl em{font-style:normal;color:var(--muted)}
.bls{display:flex;flex-direction:column;gap:3px}
.indv{font-size:11px;font-weight:700;color:var(--accent)}
.para{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding-top:8px;border-top:1px dashed var(--line)}
.para .lbl{margin-right:2px}
.hint{background:var(--accent-soft);border-radius:10px;padding:8px 12px;font-size:14px;font-weight:600}
/* pdf */
#print{position:absolute;left:-30000px;top:0;pointer-events:none}
.print{--bg:#FFFFFF; --surface:#FFFFFF; --surface-2:#EEF2F7; --line:#D3DBE7; --fg:#0D1A2C; --muted:#56647A; --accent:#1757A6; --accent-rgb:23,87,166; --accent-soft:#DCE7F7; --ok:#1C8A57; --warn:#B9770C; --bad:#C0383A; --f-bas:#1757A6; --f-com:#0C8789; --f-exc:#8A3DB6; --f-cm:#C9720A; --f-core:#2C8A3C; --f-lib:#C0447A; --t-push:#1757A6; --t-pull:#0C8789; --t-prev:#2C8A3C; --t-mov:#C9720A; --t-fis:#7451D1; --fis:#7451D1; --rea:#D9622B; --t-ses:#5A687E; --l-POR:#B9770C; --l-DEF:#1757A6; --l-MED:#2C8A3C; --l-DEL:#C0383A;background:#fff;color:var(--fg);color-scheme:light;font:14px/1.4 var(--font-b)}
.print.port{width:1000px}.print.land{width:1420px}
.print .pdf-sec{padding:6px 2px;background:#fff}
.print .scroll-x{overflow:visible}
.print .agrid{grid-template-columns:1fr 1fr}.print .agrid .wide{grid-column:1/-1}
.print .ptab{min-width:0}
.ph{display:flex;align-items:flex-end;gap:16px;border-bottom:3px solid var(--accent);padding-bottom:10px;margin-bottom:6px}
.ph h1{font-family:var(--font-d);font-size:34px;line-height:1}
.ph .sub{color:var(--muted);font-weight:600}
.ph .brand{font-size:20px;margin-left:auto}
.pweek{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.pweek .day{min-height:0}
.ptbl{border-collapse:collapse;width:100%;font-size:13.5px}
.ptbl th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--line)}
.ptbl td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.pmeta{display:flex;gap:18px;flex-wrap:wrap;font-weight:600}
.pmeta span small{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.sec-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:22px 0 10px}
.sec-h h2{font-size:22px}
.gridwrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface);-webkit-overflow-scrolling:touch}
.igrid{border-collapse:separate;border-spacing:0;width:100%;min-width:820px;font-size:13px}
.igrid th,.igrid td{border-bottom:1px solid var(--line);padding:0;vertical-align:middle}
.igrid tbody tr:last-child td{border-bottom:0}
.igrid thead th{background:var(--surface);padding:8px 4px;text-align:center;font-weight:600;border-left:1px solid var(--line)}
.igrid thead th.today{background:var(--accent-soft)}
.igrid .dh b{font-family:var(--font-d);font-size:16px;text-transform:uppercase}
.igrid .dh small{font-size:11.5px}
.igrid .pn{position:sticky;left:0;z-index:1;background:var(--surface);text-align:left;padding:5px 10px;min-width:140px;max-width:170px;border-left:0;border-right:1px solid var(--line)}
.igrid thead th.pn{z-index:2}
.igrid .nmc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;min-width:0}
.igrid tr.off .nmc{color:var(--muted)}
.igrid td{border-left:1px solid var(--line)}
.igrid td.pn{border-left:0}
.igrid td.nocall{background:repeating-linear-gradient(135deg,transparent 0 6px,var(--surface-2) 6px 8px)}
.icell{width:100%;min-height:46px;display:flex;flex-wrap:wrap;gap:3px;align-items:center;justify-content:center;align-content:center;padding:4px}
button.icell:hover{background:var(--surface-2)}
.tg{display:inline-flex;align-items:center;height:20px;padding:0 5px;border-radius:5px;font-size:11.5px;font-weight:700;color:#fff;background:var(--tc);font-family:var(--font-d);letter-spacing:.04em;white-space:nowrap}
.nt{display:block;width:100%;font-size:10.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center}
.t-push{--tc:var(--t-push);--fc:var(--t-push)}.t-pull{--tc:var(--t-pull);--fc:var(--t-pull)}.t-prev{--tc:var(--t-prev);--fc:var(--t-prev)}.t-mov{--tc:var(--t-mov);--fc:var(--t-mov)}.t-fis{--tc:var(--t-fis);--fc:var(--t-fis)}.t-ses{--tc:var(--t-ses)}
.acell{width:100%;height:42px;display:grid;place-items:center;font-family:var(--font-d);font-weight:700;font-size:15px;color:var(--muted)}
button.acell:hover{background:var(--surface-2)}
.acell.on{background:var(--ac);color:#fff}
.a-ok{--ac:var(--ok);--fc:var(--ok)}.a-par{--ac:var(--warn);--fc:var(--warn)}.a-no{--ac:var(--bad);--fc:var(--bad)}.a-fis{--ac:var(--fis);--fc:var(--fis)}.a-rea{--ac:var(--rea);--fc:var(--rea)}
.colbtn{display:block;margin:5px auto 0;font-size:11.5px;font-weight:700;color:var(--accent);padding:2px 6px;border-radius:6px;background:var(--accent-soft)}
.cnt{font-size:11px;color:var(--muted);text-align:center;padding:5px 2px;line-height:1.3}
.brushbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.brushbar .chip.on{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--cc)}
.big-tags{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.big-tags button{height:52px;border-radius:12px;border:2px solid var(--tc);font-weight:700;font-size:15px;color:var(--fg);background:var(--surface)}
.big-tags button.on{background:var(--tc);color:#fff}
.hoy{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
.hoy>.panel{order:-1}
@media(min-width:900px){.hoy{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}.hoy>.panel{order:0}}
.s4{display:inline-flex;gap:3px;flex:none}
.s4 button{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-family:var(--font-d);font-weight:700;font-size:14px;color:var(--muted)}
.s4 button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.save-st{font-size:12.5px;color:var(--muted);font-weight:600;white-space:nowrap}
.mcell{width:100%;min-height:42px;display:flex;align-items:center;justify-content:center;gap:4px;font-family:var(--font-d);font-weight:700;font-size:16px;font-variant-numeric:tabular-nums}
button.mcell:hover{background:var(--surface-2)}
.mcell.nc{color:var(--muted);font-size:13px}.mcell.les{color:#fff;background:var(--bad);font-size:13px}
.mcell .tg{height:17px;font-size:10px;padding:0 4px}
.mtot{width:96px;line-height:1.15;font-variant-numeric:tabular-nums;text-align:right;padding:4px 8px!important;white-space:nowrap;font-size:12.5px;color:var(--muted)}
.mtot b{color:var(--fg);font-family:var(--font-d);font-size:16px}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}

const dirty={};
function queueWrite(col,id){const k=col+'/'+id;const d=dirty[k]=dirty[k]||{};clearTimeout(d.t);d.t=setTimeout(()=>flushDoc(col,id),500)}
async function flushDoc(col,id){const k=col+'/'+id;const d=dirty[k];if(!d)return;clearTimeout(d.t);if(d.busy){d.again=true;return}d.busy=true;try{const doc=S[col][id];if(doc&&Object.keys(doc.p||{}).length)await put(col,id,clone(doc));else if(live)await del(col,id)}catch(e){}d.busy=false;if(d.again){d.again=false;return flushDoc(col,id)}delete dirty[k]}

function mdFor(date,team){
  const ms=matchesOf(team);if(!ms.length)return null;let prev=null,next=null;
  for(const m of ms){if(m.date===date)return 'MD';if(m.date<date)prev=m;else if(!next)next=m}
  const ds=prev?diffDays(date,prev.date):null,du=next?diffDays(next.date,date):null;
  if(ds!=null&&ds<=3&&(du==null||ds<du))return 'MD+'+ds;
  if(du!=null&&du<=10)return 'MD-'+du;
  if(ds!=null&&ds<=7)return 'MD+'+ds;
  return null;
}
const sesMd=s=>mdFor(s.date,s.team)||s.md||null;
const mdChip=md=>md?`<span class="md ${md==='MD'?'z':md.includes('-')?'m':''}">${md}</span>`:'';

}

function analyze({team,from,to,pid}){
  const R={av:{ok:0,par:0,no:0},avW:{},ses:0,reg:0,pending:0,sets:0,fam:{},famMd:{},zone:{},cm:{},core:{},lib:{},com:{},exc:{},weeks:{},days:{},players:{},compl:[0,0],mds:new Set()};
  FAM.forEach(f=>{R.fam[f.k]=0;R.famMd[f.k]={}});
  const T=today();
  for(const s of sessionsOf(team)){
    if(s.date<from||s.date>to)continue;
    const parts=(s.players||[]).filter(p=>S.players[p]&&(!pid||p===pid));if(!parts.length)continue;
    R.ses++;const reg=registered(s);if(reg)R.reg++;else if(s.date<=T)R.pending++;
    const md=sesMd(s)||'—';R.mds.add(md);const wk=monday(s.date);
    for(const p of parts){
      const a=s.att?.[p]||{};const st=a.st;const f=st==='no'?0:st==='par'?.5:1;
      if(reg&&st){R.compl[0]+=f;R.compl[1]++;R.av[st]++;(R.avW[wk]=R.avW[wk]||{ok:0,par:0,no:0})[st]++}
      const X=R.players[p]||(R.players[p]={av:{ok:0,par:0,no:0},sets:0,fam:{},last:{},ses:0,done:0,doneN:0,load:0,weeks:{},days:{}});
      X.ses++;if(reg&&st){X.done+=f;X.doneN++;X.av[st]++}
      if(a.rpe&&f>0){const L=a.rpe*(+s.dur||0)*f;X.load+=L;X.weeks[wk]=(X.weeks[wk]||0)+L;X.days[s.date]=(X.days[s.date]||0)+L;R.weeks[wk]=R.weeks[wk]||{sum:0,ps:new Set()};R.weeks[wk].sum+=L;R.weeks[wk].ps.add(p)}
      if(f===0)continue;
      for(const b of s.blocks||[]){
        if(b.who?.length&&!b.who.includes(p))continue;
        const v=(+b.sets||0)*f;if(!FB[b.f])continue;
        R.sets+=v;R.fam[b.f]+=v;R.famMd[b.f][md]=(R.famMd[b.f][md]||0)+v;
        X.sets+=v;X.fam[b.f]=(X.fam[b.f]||0)+v;
        if(s.date<=T&&(!X.last[b.f]||X.last[b.f]<s.date))X.last[b.f]=s.date;
        if(b.f==='bas'&&b.c){const z=b.s?.[0]||'Sin zona';(R.zone[b.c]=R.zone[b.c]||{})[z]=(R.zone[b.c][z]||0)+v}
        if(b.f==='cm'&&b.c){const m=(R.cm[b.c]=R.cm[b.c]||{});(b.s?.length?b.s:['(sin clave)']).forEach(k=>m[k]=(m[k]||0)+v)}
        if(b.f==='core'&&b.c){(b.s?.length?b.s:[b.c]).forEach(k=>R.core[k]=(R.core[k]||0)+v)}
        if(b.f==='lib'&&b.c)R.lib[b.c]=(R.lib[b.c]||0)+v;
        if(b.f==='com'&&b.c)R.com[b.c]=(R.com[b.c]||0)+v;
        if(b.f==='exc'&&b.c)R.exc[b.c]=(R.exc[b.c]||0)+v;
      }
    }
  }
  R.nP=Math.max(1,Object.keys(R.players).length);
  return R;
}

function acwr(X){const T=today();const ds=Object.keys(X.days||{}).sort();if(!ds.length||diffDays(T,ds[0])<21)return null;let a=0,c=0;for(const[d,L]of Object.entries(X.days||{})){const k=diffDays(T,d);if(k>=0&&k<7)a+=L;if(k>=0&&k<28)c+=L}c=c/4;return c>0?a/c:null}

let pinBuf='',pinStage='enter',pinFirst='',pinErr=false,rememberDev=true;
async function hash(s){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('rcde-fuerza::'+s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){let h=0;for(const c of 'rcde::'+s)h=(h*31+c.charCodeAt(0))|0;return 'h'+h}}
function renderLock(){
  const L=$('#lock');
  if(!S.ready){L.hidden=false;L.innerHTML=`<div class="lock-box"><div class="brand"><i></i>FUERZA <span>RCDE</span></div><small>Conectando…</small></div>`;return}
  let remembered=null;try{remembered=sessionStorage.getItem('rcde-unlock')||localStorage.getItem('rcde-unlock')}catch(e){}
  if(S.config?.pinHash&&remembered===S.config.pinHash)unlocked=true;
  if(unlocked){L.hidden=true;$('#app').hidden=false;render();return}
  const create=!S.config?.pinHash;if(create&&pinStage==='enter')pinStage='new';
  const msg=create?(pinStage==='new'?'Crea tu código de acceso (4 cifras)':'Repite el código'):'Introduce tu código';
  L.hidden=false;$('#app').hidden=true;
  L.innerHTML=`<div class="lock-box">${crestImg()}<div class="brand"><i></i>FUERZA <span>RCDE</span></div>
   <div>${msg}</div>
   <div class="pin-dots ${pinErr?'err':''}">${[0,1,2,3].map(i=>`<i class="${i<pinBuf.length?'on':''}"></i>`).join('')}</div>
   <div class="keypad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-act="pin" data-v="${n}">${n}</button>`).join('')}<span></span><button data-act="pin" data-v="0">0</button><button data-act="pin" data-v="b" aria-label="Borrar">⌫</button></div>
   ${create?'':`<button class="chip sm ${rememberDev?'on':''}" data-act="remDev">${rememberDev?'✓ ':''}Recordar en este dispositivo</button>`}
   ${!live?'<small>Vista previa: los datos no se guardan aquí.</small>':''}</div>`;
}
async function pinKey(v){
  pinErr=false;
  if(v==='b'){pinBuf=pinBuf.slice(0,-1);renderLock();return}
  if(pinBuf.length>=4)return;pinBuf+=v;renderLock();
  if(pinBuf.length<4)return;
  const code=pinBuf;pinBuf='';
  if(pinStage==='new'){pinFirst=code;pinStage='rep';renderLock();return}
  if(pinStage==='rep'){
    if(code!==pinFirst){pinStage='new';pinErr=true;toast('No coinciden. Vuelve a empezar');renderLock();return}
    const h=await hash(code);
    if(live){try{await db.doc('config/app').set({pinHash:h,created:Date.now()})}catch(e){toast('No se ha podido guardar el código');pinStage='new';renderLock();return}}
    S.config={pinHash:h};unlockOk(h);return;
  }
  const h=await hash(code);
  if(h===S.config?.pinHash)unlockOk(h);else{pinErr=true;renderLock()}
}
function unlockOk(h){unlocked=true;try{sessionStorage.setItem('rcde-unlock',h);if(rememberDev)localStorage.setItem('rcde-unlock',h)}catch(e){}renderLock()}
function lockNow(){unlocked=false;pinBuf='';pinStage='enter';try{sessionStorage.removeItem('rcde-unlock');localStorage.removeItem('rcde-unlock')}catch(e){}closeSheet();renderLock()}
document.addEventListener('keydown',e=>{if(unlocked||$('#lock').hidden)return;if(/^[0-9]$/.test(e.key))pinKey(e.key);else if(e.key==='Backspace')pinKey('b')});

/* ---------- vista: asistencia ---------- */
function attStats(team,from,to,pid){
  const R={c:{ok:0,par:0,rea:0,fis:0,no:0},days:0,w:{},players:{}};
  for(const doc of Object.values(S.attend)){
    if(doc.team!==team||doc.date<from||doc.date>to)continue;
    const ent=Object.entries(doc.p||{}).filter(([p,st])=>S.players[p]&&ATT[st]&&(!pid||p===pid));if(!ent.length)continue;
    R.days++;const wk=monday(doc.date);
    for(const [p,st] of ent){R.c[st]++;(R.w[wk]=R.w[wk]||{ok:0,par:0,rea:0,fis:0,no:0})[st]++;const X=R.players[p]||(R.players[p]={ok:0,par:0,rea:0,fis:0,no:0});X[st]++}
  }
  return R;
}
const attTot=c=>c.ok+c.par+(c.rea||0)+c.no+c.fis;
const attPct=c=>{const t=attTot(c);return t?Math.round((c.ok+c.par*.5)/t*100):null};

function hbars(obj,{order,color,div=1,labels}={}){

}

function indStats(team,from,to,pid){const c={};Object.keys(ITAGS).forEach(k=>c[k]=0);const last={},players={};
  for(const doc of Object.values(S.indiv)){if(doc.team!==team||doc.date<from||doc.date>to)continue;for(const [p,v] of Object.entries(doc.p||{})){if(!S.players[p]||(pid&&p!==pid))continue;(v.t||[]).forEach(t=>{if(c[t]==null)return;c[t]++;if(doc.date<=today()&&(!last[t]||last[t]<doc.date))last[t]=doc.date;const X=players[p]||(players[p]={});X[t]=(X[t]||0)+1})}}

function analysisBody(R,{team,pid,from,to},asSections=false){

  // carga semanal

  const wk=weeks.slice(-12).map(w=>{if(pid){return [w,R.players[pid]?.weeks[w]||0]}const x=R.weeks[w];return [w,x?x.sum/x.ps.size:0]});
  const wmax=Math.max(1,...wk.map(x=>x[1]));
  const wkL=wk.filter(x=>x[1]>0);const avgLoad=wkL.length?wkL.reduce((a,b)=>a+b[1],0)/wkL.length:0;
  const X=pid?R.players[pid]:null;const ac=X?acwr(X):null;
  const mds=MD_ORDER.filter(m=>R.mds.has(m));if(R.mds.has('—'))mds.push('—');
  const kp=`<div class="kpis">
   <div class="kpi"><div class="v">${R.ses}</div><div class="l">Sesiones</div></div>
   <div class="kpi"><div class="v" style="color:${pctColor(compl)}">${compl==null?'–':compl}<small>${compl==null?'':'%'}</small></div><div class="l">Cumplimiento fuerza</div></div>
   <div class="kpi"><div class="v">${r1(R.sets/div)}</div><div class="l">Series${per}</div></div>
   <div class="kpi"><div class="v">${Math.round(avgLoad)}</div><div class="l">sRPE semanal medio (UA)</div></div>
   ${pid?`<div class="kpi"><div class="v" style="color:${ac==null?'inherit':ac<.8||ac>1.5?'var(--bad)':ac>1.3?'var(--warn)':'var(--ok)'}">${ac==null?'–':ac.toFixed(2)}</div><div class="l">Ratio agudo:crónico${ac==null?' · mín. 3 semanas':''}</div></div>`

/* ---------- sheets ---------- */
let SH=null; // {type, draft, tab, arm}
let sheetIn=false;
let asT=null;
function sesSnap(d){const o=clone(d);delete o.isNew;(o.blocks||[]).forEach(b=>delete b._open);return JSON.stringify(o)}
function autosave(){if(!SH||SH.type!=='ses'||SH.d.isNew)return;if(sesSnap(SH.d)===SH.saved)return;clearTimeout(asT);const st=$('#saveSt');if(st)st.textContent='Guardando…';asT=setTimeout(()=>{asT=null;saveSession(false,true)},600)}
function flushAutosave(){if(asT&&SH?.type==='ses'){clearTimeout(asT);asT=null;saveSession(false,true)}}
function closeSheet(){flushAutosave();const wasMin=SH?.type==='min';SH=null;$('#sheet').innerHTML='';if(wasMin)render()}
function sheetFrame(title,body,foot){const an=sheetIn;sheetIn=false;return `<div class="sheet-wrap" data-act="bgClose"><div class="sheet ${an?'in':''}" role="dialog" aria-label="${esc(title)}"><div class="sheet-hd gut"><button class="icon-btn" data-act="close" aria-label="Cerrar">${IC.x}</button><h2>${esc(title)}</h2></div><div class="sheet-bd gut" id="shb">${body}</div>${foot?`<div class="sheet-ft gut">${foot}</div>`:''}</div></div>`}

/* sesión */
function openSession(id,date){flushAutosave();sheetIn=!SH;
  let d;
  if(id&&S.sessions[id]){d=clone(S.sessions[id]);d.id=id}
  else{const team=UI.team;d={id:uid(),isNew:true,date:date||today(),team,mode:'col',name:'',dur:45,blocks:[],att:{},players:[...playersOf('A').filter(p=>isAvail(p)).map(p=>p.id),...callupsOn(date||today())]}}
  SH={type:'ses',d,tab:(id&&d.date<=today())?'reg':'dis',arm:false};if(SH.tab==='reg')prefillAtt(d);SH.saved=sesSnap(d);drawSession();
}
function drawSession(){
  const d=SH.d;const md=mdFor(d.date,d.team);
  const title=d.isNew?'Nueva sesión':sesName(d);
  const tabs=`<div class="sub-tabs"><button data-act="sTab" data-v="dis" aria-current="${SH.tab==='dis'}">Diseño</button><button data-act="sTab" data-v="reg" aria-current="${SH.tab==='reg'}">Registro${registered(d)?' ✓':''}</button></div>`;
  const body=tabs+(SH.tab==='dis'?sesDesign(d,md):sesRegister(d));
  const foot=`<button class="btn pri" data-act="sSave">${d.isNew?'Guardar':'Listo'}</button>${d.isNew?'':`<span class="save-st" id="saveSt">✓ Guardado</span><button class="btn" data-act="sDup">${IC.copy}Duplicar</button>`}<button class="btn" data-act="sTplSave" title="Guardar como plantilla">${IC.star}Plantilla</button><button class="btn" data-act="pdfSes">${IC.pdf}PDF</button><span class="spacer"></span>${d.isNew?'':`<button class="btn danger ${SH.arm?'arm':''}" data-act="sDel">${SH.arm?'Confirmar borrado':'Eliminar'}</button>`}`;
  const keepScroll=$('#shb')?.scrollTop;
  $('#sheet').innerHTML=sheetFrame(title,body,foot);
  if(keepScroll)$('#shb').scrollTop=keepScroll;
  autosave();
}
function stepper(k,v,i,l){return `<span class="stepw"><span class="lbl">${l}</span><span class="step"><button data-act="bStep" data-i="${i}" data-k="${k}" data-v="-1" aria-label="Menos">−</button><span class="tn">${v??0}</span><button data-act="bStep" data-i="${i}" data-k="${k}" data-v="1" aria-label="Más">+</button></span></span>`}
function blockHTML(b,i){
  const f=FB[b.f];const subs=f.sub&&b.c?(f.sub(b.c)||[]):[];
  return `<div class="blk"><div class="blk-hd"><span class="no tn">${i+1}</span><span class="ftag f-${b.f}">${f.n}</span><span class="spacer"></span>

async function uploadPhoto(file){
  if(!assets){toast('La subida de fotos no está disponible aquí');return}
  try{
    const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=URL.createObjectURL(file)});
    const s=Math.min(img.width,img.height);const c=document.createElement('canvas');c.width=c.height=360;
    c.getContext('2d').drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,360,360);
    const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.85));
    const up=await assets.upload(blob,{type:'image/jpeg'});
    const old=SH.d.photo;SH.d.photo=up.id;const cur=clone(S.players[SH.id]||SH.d);cur.photo=up.id;await put('players',SH.id,cur);
    if(old){try{await assets.delete(old)}catch(e){}}
    toast('Foto actualizada');drawPlayer();
  }catch(e){toast('No se ha podido subir la foto ('+(e.code||'error')+')')}
}

  const team=UI.team,w=UI.week,prev=addDays(w,-7);const days=[...Array(7)].map((_,i)=>addDays(w,i));
  const target=d=>{const md=mdFor(d,team);return (md&&days.find(x=>mdFor(x,team)===md))||addDays(d,7)};
  const avail=playersOf(team).filter(p=>isAvail(p)).map(p=>p.id);let n=0;
  for(const s of sessionsOf(team).filter(s=>s.date>=prev&&s.date<w)){
    const o=clone(S.sessions[s.id]);o.date=target(s.date);o.att={};o.created=Date.now();o.updated=Date.now();o.md=mdFor(o.date,team);
    if(o.mode!=='ind'){o.players=avail.slice();(o.blocks||[]).forEach(b=>{if(b.who)b.who=b.who.filter(id=>o.players.includes(id))})}
    await put('sessions',uid(),o);n++;
  }
  for(let i=0;i<7;i++){const d=addDays(prev,i);const src=S.indiv[dayId(team,d)];if(!src?.p)continue;const nd=target(d);
    Object.entries(src.p).forEach(([pid,v])=>{if(!S.players[pid])return;setInd(team,nd,pid,c=>{(v.t||[]).forEach(t=>{if(!c.t.includes(t))c.t.push(t)});if(v.note&&!c.note)c.note=v.note})});n++}
  toast(n?'Semana copiada':'La semana anterior está vacía');render();
}

let libsP=null;
function loadScript(src){return new Promise((res,rej)=>{const el=document.createElement('script');el.src=src;el.onload=res;el.onerror=()=>rej(new Error('load'));document.head.appendChild(el)})}
function loadPdfLibs(){if(!libsP)libsP=Promise.all([window.jspdf?1:loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js'),window.html2canvas?1:loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js')]).catch(e=>{libsP=null;throw e});return libsP}
function pHead(title,sub){return `<div class="ph">${crestImg()}<div><h1>${esc(title)}</h1><div class="sub">${sub}</div></div><div class="brand"><i></i>FUERZA <span>RCDE</span></div></div>`}
let pdfBusy=false;
async function makePdf(filename,sections,orient='p'){
  if(pdfBusy)return;pdfBusy=true;toast('Preparando PDF…');
  try{
    await loadPdfLibs();
    const box=$('#print');box.className='print '+(orient==='l'?'land':'port');
    box.innerHTML=sections.map(h=>`<section class="pdf-sec">${h}</section>`).join('');
    try{await document.fonts?.ready}catch(e){}
    await new Promise(r=>setTimeout(r,60));
    const {jsPDF}=window.jspdf;const pdf=new jsPDF({orientation:orient,unit:'mm',format:'a4'});
    const W=pdf.internal.pageSize.getWidth(),H=pdf.internal.pageSize.getHeight(),M=10,CW=W-2*M,BOT=H-M-4;let y=M;
    for(const el of box.querySelectorAll('.pdf-sec')){
      const c=await html2canvas(el,{scale:2,backgroundColor:'#ffffff',useCORS:true,logging:false});
      if(!c.width||!c.height)continue;
      const k=c.width/CW;const h=c.height/k;
      if(h<=BOT-M){if(y+h>BOT){pdf.addPage();y=M}pdf.addImage(c.toDataURL('image/jpeg',.9),'JPEG',M,y,CW,h);y+=h+3;continue}
      let sy=0;while(sy<c.height){if(BOT-y<30){pdf.addPage();y=M}const sh=Math.min((BOT-y)*k,c.height-sy);const part=document.createElement('canvas');part.width=c.width;part.height=Math.ceil(sh);part.getContext('2d').drawImage(c,0,sy,c.width,sh,0,0,c.width,sh);pdf.addImage(part.toDataURL('image/jpeg',.9),'JPEG',M,y,CW,sh/k);y+=sh/k+3;sy+=sh}
    }
    const n=pdf.getNumberOfPages();for(let i=1;i<=n;i++){pdf.setPage(i);pdf.setFontSize(8);pdf.setTextColor(120);pdf.text(`Fuerza RCDE · ${fd(today())} · ${i}/${n}`,W-M,H-5,{align:'right'})}
    box.innerHTML='';
    const blob=pdf.output('blob');
    if(!downloads){toast('La descarga solo funciona en la app publicada');return}
    try{await downloads.save({filename,data:blob})}catch(e){if(e?.code!=='declined')toast('No se ha podido descargar ('+(e?.code||'error')+')')}
  }catch(e){console.error(e);toast('No se ha podido crear el PDF')}
  finally{pdfBusy=false;$('#print').innerHTML=''}
}

function subscribe(){
  let pending=9;const done=()=>{if(--pending===0){S.ready=true;renderLock()}};
  ['players','sessions','matches','indiv','attend','templates','callup','minutes'].forEach(col=>{let first=true;
    db.collection(col).onSnapshot(snap=>{const o={};snap.docs.forEach(d=>o[d.id]=d.data());Object.keys(dirty).forEach(k=>{const [c,i]=k.split('/');if(c===col){if(S[col][i])o[i]=S[col][i];else delete o[i]}});S[col]=o;if(SH?.type==='cell'&&col==='indiv'&&document.activeElement?.id!=='cNote')drawCell();if(SH?.type==='call'&&col==='callup')drawCallup();if(first){first=false;done()}else schedule();if(SH?.type==='pl'&&SH.ptab!=='ficha'&&col!=='players')drawPlayer()},
      err=>{console.warn(col,err);if(first){first=false;done()}});
  });
  let f=true;db.doc('config/app').onSnapshot(d=>{S.config=d.exists?d.data():null;if(f){f=false;done()}else if(unlocked)schedule()},err=>{if(f){f=false;done()}});
}

const LDB=(()=>{
  const KEY='rcde-fuerza-db-v1';let data;try{data=JSON.parse(localStorage.getItem(KEY))||null}catch(e){data=null}
  if(!data||!data.players){data={players:JSON.parse(JSON.stringify(SEED))};try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}}
  const subs=[];
  const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(data));return true}catch(e){toast('No queda espacio para guardar en este navegador');return false}};
  const cl=v=>v==null?v:JSON.parse(JSON.stringify(v));
  const snapCol=c=>({docs:Object.entries(data[c]||{}).map(([id,v])=>({id,exists:true,data:()=>cl(v)}))});
  const snapDoc=(c,id)=>{const v=data[c]?.[id];return {id,exists:v!=null,data:()=>cl(v)}};
  const notify=c=>subs.filter(x=>x.c===c).forEach(x=>setTimeout(()=>x.cb(x.id?snapDoc(c,x.id):snapCol(c)),0));
  const ref=(c,id)=>({
    set:async v=>{(data[c]=data[c]||{})[id]=cl(v);save();notify(c)},
    update:async v=>{(data[c]=data[c]||{})[id]={...(data[c][id]||{}),...cl(v)};save();notify(c)},
    delete:async()=>{if(data[c])delete data[c][id];save();notify(c)},
    onSnapshot:(cb)=>{subs.push({c,id,cb});setTimeout(()=>cb(snapDoc(c,id)),0);return()=>{}}
  });
  window.addEventListener('storage',e=>{if(e.key!==KEY)return;try{data=JSON.parse(e.newValue)||{}}catch(x){return}[...new Set(subs.map(x=>x.c))].forEach(notify)});
  return {
    collection:c=>({onSnapshot:(cb)=>{subs.push({c,cb});setTimeout(()=>cb(snapCol(c)),0);return()=>{}},doc:id=>ref(c,id)}),
    doc:path=>{const [c,id]=path.split('/');return ref(c,id)},
    dump:()=>cl(data),
    load:d=>{const keep=data.config;data=cl(d);if(!data.players)data.players=cl(SEED);if(keep&&!data.config)data.config=keep;save();[...new Set(subs.map(x=>x.c))].forEach(notify)}
  };
})();
